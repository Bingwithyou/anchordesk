services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: anchordesk
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anchordesk"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  postgres-test:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: anchordesk_test
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anchordesk_test"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  postgres-data:
